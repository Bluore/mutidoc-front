server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Docker 内置 DNS，配合变量形式的 proxy_pass，网关未启动时本容器仍可正常启动
    resolver 127.0.0.11 valid=30s;

    # --------------------------------------------------------
    # gzip
    # --------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml font/woff2;

    # --------------------------------------------------------
    # 带 hash 的静态资源：长期强缓存
    # --------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --------------------------------------------------------
    # 接口统一转发到已存在的网关（mutidoc-net 上的 nginx-gateway:8081）
    # 若前端仅通过网关访问、希望由网关直接处理 /api，可删除此段。
    # --------------------------------------------------------
    location /api/ {
        set $gateway_upstream http://nginx-gateway:8081;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header REMOTE-HOST       $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_pass $gateway_upstream;
    }

    # --------------------------------------------------------
    # Agent 事件流（SSE）：关闭响应缓冲并放宽读超时，否则 nginx 会把
    # text/event-stream 攒起来一次性下发，前端就看不到逐条回复了。
    # 前缀更长，会优先于上面的 /api/ 命中。
    # --------------------------------------------------------
    location /api/agent/ {
        set $gateway_upstream http://nginx-gateway:8081;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header REMOTE-HOST       $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_http_version 1.1;

        proxy_connect_timeout 5s;
        proxy_read_timeout    3600s;
        proxy_buffering       off;
        proxy_cache           off;
        gzip                  off;

        proxy_pass $gateway_upstream;
    }

    # --------------------------------------------------------
    # SPA 路由回退：history 模式下刷新子路由不 404
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
