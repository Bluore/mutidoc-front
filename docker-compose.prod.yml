# Mutidoc 前端生产环境（多阶段构建 → nginx 托管静态产物）
#
# 用法（在项目根目录）：
#   docker compose -f docker-compose.prod.yml build     # 构建镜像（VITE_ 变量在此时注入）
#   docker compose -f docker-compose.prod.yml up -d     # 启动
#   docker compose -f docker-compose.prod.yml logs -f   # 查看日志
#   docker compose -f docker-compose.prod.yml down      # 停止并删除容器
#
# 与 Muti-Document-Server 共用已存在的外部网络 mutidoc-net，
# 由已部署的 nginx-gateway 统一入口转发。
# 开发环境（Vite dev server + HMR）请使用 docker-compose.yml。
services:
  mutidoc-front:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        # 构建期变量（VITE_ 变量在 build 时注入，见 .env.production）
        PNPM_VERSION: 11.1.1
        # npm 源，默认国内镜像；海外/内网源可通过环境变量覆盖
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: mutidoc-front:latest
    container_name: mutidoc-front
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    # 对外暴露端口（容器内为 80）；网关走内部网络访问时此端口可按需删除
    ports:
      - "8890:80"
    networks:
      - mutidoc-net

# 复用已存在的外部网络（由 Server 侧 / docker network create 创建），不要在此重复声明 driver/ipam
networks:
  mutidoc-net:
    external: true
